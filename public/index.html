<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Acesso ao HelpDesk</h2>
            <div id="mensagem" class="error-msg"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="email" placeholder="E-mail corporativo" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <a href="cadastro.html" class="auth-link">Não tem conta? Cadastre-se</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('mensagem');
            msgDiv.innerText = '';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    //salva o token JWT no navegador
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('email', email);
                    window.location.href = 'dashboard.html';
                } else {
                    msgDiv.innerText = data.message || 'E-mail ou senha incorretos.';
                }
            } catch (error) {
                msgDiv.innerText = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
