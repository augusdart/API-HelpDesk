<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk - Criar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Criar Conta</h2>
            <div id="mensagem" class="error-msg"></div>
            
            <form id="cadastroForm">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Nome completo" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="E-mail corporativo" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Senha (min. 6 caracteres)" required>
                </div>
                <button type="submit" class="btn-primary btn-success">Cadastrar</button>
            </form>

            <a href="index.html" class="auth-link">Já tem conta? Faça login</a>
        </div>
    </div>

    <script>
        document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('mensagem');
            msgDiv.innerText = '';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Conta criada com sucesso! Faça login para continuar.');
                    window.location.href = 'index.html';
                } else if (response.status === 422) {
                    // Mostra os erros do express-validator na tela
                    msgDiv.innerText = data.errors.map(err => Object.values(err)[0]).join(' | ');
                } else {
                    msgDiv.innerText = data.message || 'Erro ao cadastrar.';
                }
            } catch (error) {
                msgDiv.innerText = 'Erro de conexão com o servidor.';
            }
        });
    </script>
</body>
</html>
